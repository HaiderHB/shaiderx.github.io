<!doctype html>
<!--
  GoodTime launch film (kit 1.1: text-first, music bed, no voice, no next-steps card). 44.65 s.
  Recorded 2026-11-16 with kit/scripts/capture.cjs from an isolated next build of the demo, preview mode:
  the page's example run (model outputs recorded from live preview runs; tools, checks, holds and the
  calendar computed in the browser). Labelled "Example run" in the first cue.
    coldopen   0.00-2.40   kit block: the loop glance flips from "Loop at risk" to "Loop rescued" (clip hook)
    rescue     2.40-20.35  the dropout message, the calendar, the run trace, the decision (clip main)
    chat      20.35-41.65  the candidate's request and the replan, drafted messages, audit trail (clip main)
    endcard   41.65-44.65  kit block: Haider Bokhari · haiderb.com
    captions   2.40-41.65  v2 cues + 6-step progress stepper
    music      0.00-44.65  bright-pluck-112, written by: node ../../kit/scripts/music-bed.mjs .
  QA: node ../../kit/scripts/qa.mjs . --frames
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/tokens.css" />
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/kit.js"></script>
    <script src="data/clips.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-kit-accent="cobalt" data-start="0" data-duration="44.65" data-width="1920" data-height="1080">
      <div id="coldopen" data-composition-id="coldopen" data-composition-src="kit/blocks/cold-open.html" data-kit-role="cold-open"
        data-variable-values='{"kicker": "Prototype for GoodTime · Haider Bokhari", "headline": "Interviewer out. Loop *rescued*.", "focus": "glance", "zoom": 1.35, "push": 0.05}'
        data-start="0" data-duration="2.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="rescue" data-composition-id="rescue" data-composition-src="compositions/rescue.html" data-kit-role="footage"
        data-start="2.4" data-duration="17.95" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div id="chat" data-composition-id="chat" data-composition-src="compositions/chat.html" data-kit-role="footage"
        data-start="20.35" data-duration="21.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="kit/blocks/end-card.html" data-kit-role="end-card"
        data-variable-values='{"question": "", "name": "Haider Bokhari", "url": "haiderb.com"}'
        data-start="41.65" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-kit-role="captions"
        data-start="2.4" data-duration="39.25" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 20"></div>

      <!-- the instrumental bed: written by node ../../kit/scripts/music-bed.mjs . (re-run when the length changes) -->
      <!-- kit:music:start -->
      <audio id="music" class="clip kit-music" src="assets/music/bright-pluck-112.mp3" data-kit-music="bright-pluck-112" data-start="0" data-duration="44.65" data-media-start="14.55" data-volume="0.569" data-fade-in="0.3" data-fade-out="1.5" data-kit-lufs="-20" data-timeline-role="music" data-track-index="9"></audio>
      <!-- kit:music:end -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
