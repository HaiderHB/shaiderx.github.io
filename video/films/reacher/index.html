<!doctype html>
<!--
  Reacher launch film (kit 1.1: text-first, music bed, no voice, no next-steps card).
    coldopen   0.0-2.4    the run-at-a-glance card as the example ranking replays: funnel 40 -> 8, top match
    match      2.4-21.15  step 1: product -> Find creators -> filter, Jev fit + acceptance, top 8 with whys
    invite     21.15-29.75 step 2: the invite streams for the top match; the rate check under it
    reply      29.75-44.25 step 3: the creator asks 20% + 2 samples; Jev picks counter-offer; code caps 18%
    endcard    44.25-46.75 Haider Bokhari · haiderb.com
    captions   one host over the footage scenes: v2 cues + progress stepper (8 steps)
    music      bright-pluck-112 under the whole film (node ../../kit/scripts/music-bed.mjs .)
  All footage: the real page in preview mode, replaying example runs recorded live on 2026-11-16.
  QA: node ../../kit/scripts/qa.mjs .   (or: npm run qa -- films/reacher)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/tokens.css" />
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/kit.js"></script>
    <script src="data/clips.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-kit-accent="coral" data-start="0" data-duration="46.75" data-width="1920" data-height="1080">
      <div id="coldopen" data-composition-id="coldopen" data-composition-src="kit/blocks/cold-open.html" data-kit-role="cold-open"
        data-variable-values='{"kicker": "Prototype for Reacher · Haider Bokhari", "headline": "Creators who’ll say *yes*", "focus": "glance,heroTitle", "zoom": 1.45, "push": 0.04, "align": "bottom"}'
        data-start="0" data-duration="2.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="match" data-composition-id="match" data-composition-src="compositions/match.html" data-kit-role="footage"
        data-start="2.4" data-duration="18.75" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div id="invite" data-composition-id="invite" data-composition-src="compositions/invite.html" data-kit-role="footage"
        data-start="21.15" data-duration="8.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <div id="reply" data-composition-id="reply" data-composition-src="compositions/reply.html" data-kit-role="footage"
        data-start="29.75" data-duration="14.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="kit/blocks/end-card.html" data-kit-role="end-card"
        data-variable-values='{"question": "", "name": "Haider Bokhari", "url": "haiderb.com"}'
        data-start="44.25" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-kit-role="captions"
        data-start="2.4" data-duration="41.85" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 20"></div>

      <!-- the instrumental bed under the whole film: written by node ../../kit/scripts/music-bed.mjs . -->
      <!-- kit:music:start -->
      <audio id="music" class="clip kit-music" src="assets/music/bright-pluck-112.mp3" data-kit-music="bright-pluck-112" data-start="0" data-duration="46.75" data-media-start="12.45" data-volume="0.569" data-fade-in="0.3" data-fade-out="1.5" data-kit-lufs="-20" data-timeline-role="music" data-track-index="9"></audio>
      <!-- kit:music:end -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
