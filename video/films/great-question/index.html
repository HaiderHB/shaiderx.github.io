<!doctype html>
<!--
  Great Question launch film v3 (kit 1.1: text-first, one music bed, no voice of any kind). 47.02 s.
  Footage: take3a (one live voice interview on the revamped demo page, 2026-11-15) and, for the MCP beat
  only, take3b (the second take, same script; labelled "Second take").
    coldopen   0.00-2.20   kit block: T1 arriving live with Jev's scores, dock "Moderator speaking"
    interview  2.20-25.40  Q1 spoken, the (simulated) answer at 3x, a voice turn at 1x, Jev's live flag on T3
                           (leading 64%), the next probe (13%)
    trace     25.40-28.65  the Trace view: leading peaks at T3
    findings  28.65-37.47 Generate findings (wait at 6x): 4 findings, every one quoting the participant
    mcp       37.47-44.42 get_quote over MCP (take3b)
    endcard   44.42-47.02 kit block, sign-off only
    captions   2.20-44.42 one host: v2 cues (kicker = step, headline, detail) + progress stepper
    music      0-47.02    one instrumental bed, written by node ../../kit/scripts/music-bed.mjs .
  QA: node ../../kit/scripts/qa.mjs . --frames     Render: npm run render
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/tokens.css" />
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/kit.js"></script>
    <script src="data/clips.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-kit-accent="coral" data-start="0" data-duration="47.02" data-width="1920" data-height="1080">
      <div id="coldopen" data-composition-id="coldopen" data-composition-src="kit/blocks/cold-open.html" data-kit-role="cold-open"
        data-variable-values='{"kicker": "Prototype for Great Question · Haider Bokhari", "headline": "Voice interviews, *checked* live", "focus": "coverage,dock,status,mod1", "zoom": 1.5, "push": 0}'
        data-start="0" data-duration="2.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="interview" data-composition-id="interview" data-composition-src="compositions/interview.html" data-kit-role="footage"
        data-start="2.2" data-duration="23.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div id="trace" data-composition-id="trace" data-composition-src="compositions/trace.html" data-kit-role="footage"
        data-start="25.4" data-duration="3.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <div id="findings" data-composition-id="findings" data-composition-src="compositions/findings.html" data-kit-role="footage"
        data-start="28.65" data-duration="8.82" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>

      <div id="mcp" data-composition-id="mcp" data-composition-src="compositions/mcp.html" data-kit-role="footage"
        data-start="37.47" data-duration="6.95" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="kit/blocks/end-card.html" data-kit-role="end-card"
        data-variable-values='{"question": "", "name": "Haider Bokhari", "url": "haiderb.com"}'
        data-start="44.42" data-duration="2.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 6"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-kit-role="captions"
        data-start="2.2" data-duration="42.22" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 20"></div>

      <!-- the instrumental bed: written by node ../../kit/scripts/music-bed.mjs . (re-run when the length changes) -->
      <!-- kit:music:start -->
      <audio id="music" class="clip kit-music" src="assets/music/bright-pluck-112.mp3" data-kit-music="bright-pluck-112" data-start="0" data-duration="47.02" data-media-start="12.18" data-volume="0.569" data-fade-in="0.3" data-fade-out="1.5" data-kit-lufs="-20" data-timeline-role="music" data-track-index="9"></audio>
      <!-- kit:music:end -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
