<!doctype html>
<!--
  Blackletter launch film (blackletter), scaffolded by kit/scripts/new-film.mjs (kit 2, launch format).
  The beat table is in SPEC.md: write it first, then set the times here and in compositions/.
    hook       0.0-4.2     real footage of the best moment, zoomed; the hook line (<= 7 words)
    what       4.2-7.2    statement: what it is, over blurred product footage
    problem    7.2-10.2   statement: the pain, over the "before" state
    hero       10.2-30.2   ONE real task in 3-4 shots
    feature2   30.2-39.2   one idea, tied to the same problem
    feature3   39.2-48.2   the coolest one, last
    proof      48.2-55.2   the finished result, wider, with 1-3 real numbers + one under-the-hood line
    launchend  55.2-60.2   Built for … / Try it live … / haiderb.com
    captions   0-55.2      hook line, one caption per shot, proof numbers, chapters + progress bar
    music      one instrumental bed under the whole film: node ../../kit/scripts/music-bed.mjs .
  60-75 s (QA: 55-90 s). QA: node ../../kit/scripts/qa.mjs .   (or: npm run qa -- films/blackletter)
  data-kit-format="launch" turns on the launch rules; data-kit-beat on each host names its beat;
  data-kit-run says what the footage is (live | example | cached | mixed); data-kit-accent = the demo page's accent.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/tokens.css" />
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/kit.js"></script>
    <script src="data/clips.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-kit-format="launch" data-kit-accent="cobalt" data-kit-run="live" data-start="0" data-duration="69" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-kit-role="footage" data-kit-beat="hook"
        data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="what" data-composition-id="what" data-composition-src="compositions/what.html" data-kit-role="statement" data-kit-beat="what"
        data-start="4.5" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div id="problem" data-composition-id="problem" data-composition-src="compositions/problem.html" data-kit-role="statement" data-kit-beat="problem"
        data-start="7.5" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <div id="hero" data-composition-id="hero" data-composition-src="compositions/hero.html" data-kit-role="footage" data-kit-beat="hero"
        data-start="10.5" data-duration="16.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>

      <div id="feature2" data-composition-id="feature2" data-composition-src="compositions/feature2.html" data-kit-role="footage" data-kit-beat="feature"
        data-start="27" data-duration="12.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>

      <div id="feature3" data-composition-id="feature3" data-composition-src="compositions/feature3.html" data-kit-role="footage" data-kit-beat="feature"
        data-start="39.5" data-duration="18" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 6"></div>

      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-kit-role="footage" data-kit-beat="proof"
        data-start="57.5" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 7"></div>

      <div id="launchend" data-composition-id="launchend" data-composition-src="kit/blocks/launch-end.html" data-kit-role="end-card" data-kit-beat="end"
        data-variable-values='{"built": "Built for *Blackletter* by Haider Bokhari", "action": "Try it live: the link is in my message", "url": "haiderb.com"}'
        data-start="64" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 8"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-kit-role="captions"
        data-start="0" data-duration="64" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 20"></div>

      <!-- the instrumental bed: written by node ../../kit/scripts/music-bed.mjs . (re-run when the length changes) -->
      <!-- kit:music:start -->
      <audio id="music" class="clip kit-music" src="assets/music/bright-pluck-112-long.mp3" data-kit-music="bright-pluck-112-long" data-start="0" data-duration="69" data-media-start="24.5" data-volume="0.575" data-fade-in="0.3" data-fade-out="1.5" data-kit-lufs="-20" data-timeline-role="music" data-track-index="9"></audio>
      <!-- kit:music:end -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
