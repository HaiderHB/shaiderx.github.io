  kit/components/launch-captions.html — skeleton of compositions/captions.html for a launch-format film
  (kit 2). One host over the whole film up to the end card. It carries every line of text except the two
  statement scenes and the end card: the hook line, one caption per shot, the proof numbers, and the
  chapters (3-4 plain labels over a thin progress bar).

  Rules (QA fails the film otherwise)
    one cue at a time; ONE line; <= 8 words (9-12 warns, more fails); 68 px (64-72); no kicker, no stepper
    on screen >= max(2.5, 0.5 + 0.6 x words) s and <= 7 s; the hook line <= 7 words
    plain words: say what it means for the viewer, not what was clicked; no internal names
    the cue starts on the cut / camera move of its shot, and the camera does not move again under it
    labels (.kit-chip, .kit-speed) sit in .kit-cap-tags under the headline: example runs, speed changes,
    held frames. They are labels (<= 5 words), not counted in the reading time.
  The band (.kit-band2) is on wherever a cue is on; leave it off under the statement scenes.
  Used by: gc-ai.
-->
