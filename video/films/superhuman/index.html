<!doctype html>
<!--
  Superhuman launch film (superhuman), scaffolded by kit/scripts/new-film.mjs (kit 2, launch format).
  The beat table is in SPEC.md. Re-cut on kit 2.1 (2026-11-18): 3 s text screens and the result rule.
    hook       0.0-4.2     the approval gate holds the agent's reply; the judge's scores land
    what       4.2-7.2     statement (3 s): what it is, over the workspace while the agent works, blurred
    problem    7.2-10.2    statement (3 s): the pain, over the untouched inbox
    hero       10.2-32.9   ONE task: Run, the finished tool-call log, the reply held at the gate, Approve and send
    feature2   32.9-45.8   permissions: narrow the grant, the server blocks every change
    feature3   45.8-57.8   evals: the summary tiles, task 6 (the scam reply) open
    proof      57.8-63.8   the eval section, wide, with three numbers from the recorded eval run
    launchend  63.8-68.8   Built for Superhuman by Haider Bokhari / Try it live / haiderb.com
    captions   0-63.8      hook line, one caption per shot, proof numbers, chapters + progress bar
    music      one instrumental bed under the whole film: node ../../kit/scripts/music-bed.mjs .
  60-75 s (QA: 55-90 s). QA: node ../../kit/scripts/qa.mjs .   (or: npm run qa -- films/superhuman)
  data-kit-format="launch" turns on the launch rules; data-kit-beat on each host names its beat;
  data-kit-run says what the footage is (live | example | cached | mixed); data-kit-accent = the demo page's accent.
-->
