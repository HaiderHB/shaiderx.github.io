<!doctype html>
<!--
  {{COMPANY}} launch film ({{SLUG}}), scaffolded by kit/scripts/new-film.mjs. Retention-first shape:
    coldopen   0.0-2.2   kit block: real footage on screen from frame 0, headline in the band
    demo       2.2-40.2  footage scene(s): compositions/*.html, camera from shot data
    nextsteps            kit block, 3-4.5 s
    endcard              kit block, <= 3 s
    captions             one host over the footage scenes
  Hard cap 60 s (target 45-55 s). QA: node ../../kit/scripts/qa.mjs .   (or: npm run qa -- {{SLUG}})
  data-kit-role on each host tells QA what the scene is.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/tokens.css" />
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/kit.js"></script>
    <script src="data/clips.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111111;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111111;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="47" data-width="1920" data-height="1080">
      <div id="coldopen" data-composition-id="coldopen" data-composition-src="kit/blocks/cold-open.html" data-kit-role="cold-open"
        data-variable-values='{"kicker": "Prototype for {{COMPANY}} · Haider Bokhari", "headline": "What it does, in *one* line", "focus": "page", "zoom": 1.4}'
        data-start="0" data-duration="2.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="demo" data-composition-id="demo" data-composition-src="compositions/demo.html" data-kit-role="footage"
        data-start="2.2" data-duration="38" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div id="nextsteps" data-composition-id="nextsteps" data-composition-src="kit/blocks/next-steps.html" data-kit-role="next-steps"
        data-variable-values='{"label": "If I join", "head": "First 30 days", "row1": "First thing", "row2": "Second thing (detail)", "row3": "Third thing"}'
        data-start="40.2" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="kit/blocks/end-card.html" data-kit-role="end-card"
        data-variable-values='{"question": "The one question for the {{COMPANY}} team, with one *cyan* word?", "name": "Haider Bokhari", "url": "haiderb.com"}'
        data-start="44.2" data-duration="2.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-kit-role="captions"
        data-start="2.2" data-duration="38" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 20"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
