<!doctype html>
<!--
  {{COMPANY}} launch film ({{SLUG}}), scaffolded by kit/scripts/new-film.mjs (kit 1.1: text-first, music bed,
  no voice, no next-steps card). Retention-first shape:
    coldopen   0.0-2.2   kit block: real footage on screen from frame 0, headline (<= 4 words at 2.2 s) in the band
    demo       2.2-47.4  footage scene(s): compositions/*.html, camera from shot data, annotations
    endcard              kit block, <= 3 s: name · haiderb.com (closing question optional)
    captions             one host over the footage scenes: v2 cues (kicker, headline, detail) + progress stepper
    music                one instrumental bed under the whole film: node ../../kit/scripts/music-bed.mjs .
  Hard cap 60 s (target 45-55 s). QA: node ../../kit/scripts/qa.mjs .   (or: npm run qa -- {{SLUG}})
  data-kit-role on each host tells QA what the scene is; data-kit-accent = the demo page's accent.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/tokens.css" />
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/kit.js"></script>
    <script src="data/clips.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111111;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111111;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-kit-accent="iris" data-start="0" data-duration="50" data-width="1920" data-height="1080">
      <div id="coldopen" data-composition-id="coldopen" data-composition-src="kit/blocks/cold-open.html" data-kit-role="cold-open"
        data-variable-values='{"kicker": "Prototype for {{COMPANY}} · Haider Bokhari", "headline": "What it *does*", "focus": "page", "zoom": 1.4}'
        data-start="0" data-duration="2.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="demo" data-composition-id="demo" data-composition-src="compositions/demo.html" data-kit-role="footage"
        data-start="2.2" data-duration="45.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>


      <div id="endcard" data-composition-id="endcard" data-composition-src="kit/blocks/end-card.html" data-kit-role="end-card"
        data-variable-values='{"question": "", "name": "Haider Bokhari", "url": "haiderb.com"}'
        data-start="47.4" data-duration="2.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-kit-role="captions"
        data-start="2.2" data-duration="45.2" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 20"></div>

      <!-- the instrumental bed: written by node ../../kit/scripts/music-bed.mjs . (re-run when the length changes) -->
      <!-- kit:music:start -->
      <audio id="music" class="clip kit-music" src="assets/music/bright-pluck-112.mp3" data-kit-music="bright-pluck-112" data-start="0" data-duration="50" data-media-start="9.2" data-volume="0.569" data-fade-in="0.3" data-fade-out="1.5" data-kit-lufs="-20" data-timeline-role="music" data-track-index="9"></audio>
      <!-- kit:music:end -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
